[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-stats"
version = "0.1.0"
description = "Personal GPS performance dashboard (training + match load, body composition) for an amateur footballer"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
